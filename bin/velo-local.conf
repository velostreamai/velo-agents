# The ONE place the worker:local model, its server and its sampling are defined.
#
# Sourced by velo-dispatch (the worker:local route), velo-pr-gate (check-spec
# and the second-opinion review), velo-status (route detection), velo-local-setup
# and velo-llama-server; read by both Python runners through
# velo_runner_lib.local_conf. The model id and endpoint used to be hardcoded in
# each of them, and the copies drifted.
#
# Qwen3.8-Flash-Next, unsloth UD-Q3_K_XL GGUF. Chosen on the #2235 A/B: the only
# local model with correct verdicts and exact root causes.
#
# Environment overrides for one run: VELO_LOCAL_MODEL (#2230), VELO_LMSTUDIO_URL.
# The GGUF build's id, as LM Studio and llama-server (--alias) serve it. Separate
# from VELO_LOCAL_MODEL_DEFAULT, which follows the chosen backend: `velo-local use
# llama` starts llama-server while the recorded backend may still be sushi.
VELO_GGUF_MODEL_ID=qwen3.8-flash-next-ud
VELO_LOCAL_MODEL_DEFAULT=$VELO_GGUF_MODEL_ID

# ---- the server: LM Studio, tuned -------------------------------------------
# Same model, 43K-token prompt, M4 Max:
#   LM Studio, default load settings         214 s prefill   10.9 tok/s
#   LM Studio, the LMSTUDIO_* settings below 137 s            22.5 tok/s
#   llama-server (velo-llama-server)          87 s            26.0 tok/s
# A follow-up that reuses the prompt reads in 7.5 s on LM Studio, so an agent
# turn — mostly the same conversation re-sent — pays the decode gap, ~12%. Most
# of that is --spec-type ngram-mod, which LM Studio does not offer. Chosen for
# the UI when wanted: browsing, downloading and trying new models happen there.
# NOT the default — see the backend section at the end of this file.
VELO_LMSTUDIO_BASE_URL=http://127.0.0.1:1234/v1
# LM Studio's CLI. It can START LM Studio's background service as a side effect,
# so scripts only call it once the server at VELO_LMSTUDIO_BASE_URL answers.
VELO_LMS="/Applications/LM Studio.app/Contents/Resources/app/.webpack/lms"
# Written into LM Studio's per-model load config by velo-local-setup. Without
# them LM Studio loads 4 slots with small batches and is 2.5x slower.
LMSTUDIO_CONTEXT=262144          # native context; run D died at 131072
LMSTUDIO_EVAL_BATCH=4096         # prefill
LMSTUDIO_PHYSICAL_BATCH=2048     # prefill
LMSTUDIO_KV_TYPE=q8_0            # decode, and half the KV memory
LMSTUDIO_PARALLEL=1              # one worker at a time; the GPU is the bottleneck

# ---- sampling: SENT on every request by the runner ----------------------------
# Qwen's thinking-mode values. Sent rather than configured, because LM Studio's
# per-model sampling config could not be shown to apply and llama.cpp's own
# default is temp 0.8.
VELO_LOCAL_TEMPERATURE=1.0
VELO_LOCAL_TOP_P=0.95
VELO_LOCAL_TOP_K=20
VELO_LOCAL_MIN_P=0

# ---- the model files ---------------------------------------------------------
# In LM Studio's models folder, so its UI lists the model. Setup downloads any
# missing or short shard from VELO_LOCAL_HF.
VELO_LOCAL_HF=unsloth/Qwen3.8-Flash-Next-GGUF/UD-Q3_K_XL
VELO_LOCAL_GGUF_DIR="$HOME/.cache/lm-studio/models/unsloth/Qwen3.8-Flash-Next-UD-Q3_K_XL-GGUF"
VELO_LOCAL_GGUF_SHARDS="Qwen3.8-Flash-Next-UD-Q3_K_XL-00001-of-00003.gguf Qwen3.8-Flash-Next-UD-Q3_K_XL-00002-of-00003.gguf Qwen3.8-Flash-Next-UD-Q3_K_XL-00003-of-00003.gguf"

# ---- the faster alternative: velo-llama-server ----------------------------------
# ~12% faster decode and an enforceable --reasoning-budget; no UI. Switch with
# `velo-local use llama` (and back with `velo-local use lmstudio`), which stops
# one server before starting the other: two 84 GB copies do not fit in 128 GB.
VELO_LLAMA_SERVER_URL=http://127.0.0.1:8091/v1
# unsloth's llama.cpp fork, pinned: the only build that can run this model's MTP
# heads (upstream ggml-org/llama.cpp#28243 is still open). Downloaded by
# `velo-llama-server setup` into machine state, so install.sh never touches it.
# Measured against Homebrew's upstream build in one session, same flags, M4 Max:
#   build alone          36.0 vs 35.9 tok/s (small ctx), 27.2 vs 26.8 (33K ctx)
#   + MTP, 2 drafted     40.6 tok/s (+11%), 31.3 tok/s (+15%); 55-63% accepted
# MTP is exact: the draft only proposes, the main model decides every token.
# Moving back to Homebrew once #28243 merges is a two-line change here.
VELO_LLAMA_FORK_TAG=b11160-mix-a6922cc
VELO_LLAMA_FORK_DIR="${VELO_STATE:-$HOME/.agents/state}/llama-fork"
VELO_LLAMA_SERVER="$VELO_LLAMA_FORK_DIR/llama-$VELO_LLAMA_FORK_TAG/llama-server"
# The MTP draft head. "shared" borrows the main model's embedding and output
# projection (1.3 GB smaller than the self-contained file, drafts identically);
# it logs one harmless error while measuring memory at startup.
VELO_LOCAL_MTP_HF_DIR=MTP
VELO_LOCAL_MTP=mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
#   -ub 2048 -b 4096        prefill 91 s -> 78 s
#   -ctk/-ctv q8_0          decode 21.4 -> 24.6 tok/s
#   --spec-type draft-mtp   replaces ngram-mod (15-20% of drafts accepted on
#                           reasoning, which is mostly new text)
#   --metrics               Prometheus endpoint (:8091/metrics): tok/s, queue and
#                           KV use without parsing llama-server.log (#2362)
VELO_LLAMA_ARGS="-ngl 99 -c $LMSTUDIO_CONTEXT -np 1 -fa on -ub $LMSTUDIO_PHYSICAL_BATCH -b $LMSTUDIO_EVAL_BATCH -ctk $LMSTUDIO_KV_TYPE -ctv $LMSTUDIO_KV_TYPE --spec-type draft-mtp -md $VELO_LOCAL_GGUF_DIR/$VELO_LOCAL_MTP --spec-draft-n-max 2 --jinja --temp $VELO_LOCAL_TEMPERATURE --top-p $VELO_LOCAL_TOP_P --top-k $VELO_LOCAL_TOP_K --min-p $VELO_LOCAL_MIN_P --metrics"

# Thinking cap, EXPORTED by `velo-llama-server run` as llama.cpp's own env vars
# (LLAMA_ARG_THINK_BUDGET / _MESSAGE) because the message has spaces and
# VELO_LLAMA_ARGS is word-split. Uncapped, a read-only review spent 96% of 5400 s
# decoding 6-8K-token thinking turns and timed out. On a maths check 1K gave a
# confidently wrong answer, 4K stayed correct (3/3) and ~30% faster.
# The MESSAGE must ask for the next ACTION: "give your best answer now" made
# agents end multi-step runs with a prose reply the moment the cap fired (#2291).
VELO_LLAMA_THINK_BUDGET=4096
VELO_LLAMA_THINK_BUDGET_MESSAGE="Thinking budget reached. Stop deliberating and act: emit your next tool call now. Write a final report only if every step of the task is done."

# Reasoning effort, exported as LLAMA_ARG_REASONING_EFFORT (#2362). The model's
# chat template defaults to xhigh when nothing is sent. medium WITH the 4K cap
# above: +26% decode on maths, +24% on code, 35-40% less thinking, 2/2 correct,
# because medium-effort text is far more predictable for the MTP head (79-88% of
# drafts accepted against 54-60%). medium WITHOUT the cap ran to the 20K token
# ceiling and never answered, so the cap is what makes it safe; keep both.
# The template accepts xhigh, medium and low only; `run` refuses anything else.
VELO_LLAMA_REASONING_EFFORT=medium

# ---- the trial alternative: Sushi (MLX) ----------------------------------------
# beamivalice/sushi (`brew install beamivalice/tap/sushi`) serving its own EXL3
# 4bpw pack of the same model: 64 GB resident against the GGUF's 84 GB. Same
# 53K-token prompt, M4 Max, both at medium effort with MTP:
#   llama-server UD-Q3_K_XL   453 tok/s prefill   35 tok/s decode   5.2 s warm turn
#   Sushi 4bpw                734 tok/s           64-69 tok/s       0.65 s
# #2235 replay (known answer): both verdicts and both root-cause sites right, and
# it went further (reproduced red on the pre-fix commit). 19 s of model time per
# turn against 32.7 s, but 146 turns / 143K output tokens against 44 / 36K, so
# 63 min wall against 28. Adopted on trial to see which of those dominates.
# Sushi's 95 GB n-gram table (ngram_table.bin) stays on SSD; it is not resident.
VELO_SUSHI_SERVER_URL=http://127.0.0.1:8092/v1
VELO_SUSHI_MODEL_ID=beamster/Qwen3.8-Flash-Next-Sushi-4bpw
VELO_SUSHI_MODEL_DIR="$HOME/.sushi/models/$VELO_SUSHI_MODEL_ID"
# Effort, thinking cap and context are llama-server's own settings ON PURPOSE,
# not copies: the two backends are only comparable while they run alike, and
# one value can't drift from the other. --think sets the effort a request
# naming none runs at — Sushi's own default for this model is OFF, and the
# runner sends no effort, so without it a worker would not think at all.
VELO_SUSHI_ARGS="--think $VELO_LLAMA_REASONING_EFFORT --reasoning-budget $VELO_LLAMA_THINK_BUDGET --ctx-size $LMSTUDIO_CONTEXT"

# ---- which server worker:local uses ------------------------------------------
# MACHINE state, set by `velo-local use lmstudio|llama|sushi` and kept outside the repo
# so install.sh never resets it. No file means llama, the default: ~12% faster
# decode and an enforceable --reasoning-budget. LM Studio is the opt-in for its
# UI (`velo-local use lmstudio`, or velo-local-setup). An unknown
# value leaves VELO_LOCAL_BASE_URL unset, so every consumer fails loud rather
# than guessing a server.
VELO_LOCAL_BACKEND_FILE="${VELO_STATE:-$HOME/.agents/state}/local-backend"
VELO_LOCAL_BACKEND=$(cat "$VELO_LOCAL_BACKEND_FILE" 2>/dev/null || echo llama)
unset VELO_LOCAL_BASE_URL
case "$VELO_LOCAL_BACKEND" in
  lmstudio) VELO_LOCAL_BASE_URL=$VELO_LMSTUDIO_BASE_URL ;;
  llama)    VELO_LOCAL_BASE_URL=$VELO_LLAMA_SERVER_URL ;;
  # Sushi names the model by its pack, not by an alias we choose.
  sushi)    VELO_LOCAL_BASE_URL=$VELO_SUSHI_SERVER_URL
            VELO_LOCAL_MODEL_DEFAULT=$VELO_SUSHI_MODEL_ID ;;
esac
