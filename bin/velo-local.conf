# The ONE place the worker:local model and its server are defined.
#
# Sourced by velo-dispatch (the worker:local route), velo-pr-gate (check-spec
# and the second-opinion review), velo-status (route detection) and
# velo-llama-server (the server itself); read by velo_worker_runner.py. The model
# id and endpoint used to be hardcoded in each of them, and the copies drifted.
#
# Qwen3.8-Flash-Next, unsloth UD-Q3_K_XL GGUF. Chosen on the #2235 A/B: the only
# local model with correct verdicts and exact root causes.
#
# Served by llama-server DIRECTLY, not through LM Studio's API. Same binary, same
# model, same 43K-token prompt, M4 Max: LM Studio 214 s prefill / 10.9 tok/s;
# llama-server with the flags below 85 s / 27.1 tok/s. LM Studio also ignored
# its per-model sampling config, leaving llama.cpp's temp 0.8 default in force.
#
# Environment overrides for one run: VELO_LOCAL_MODEL (#2230), VELO_LMSTUDIO_URL.
VELO_LOCAL_MODEL_DEFAULT=qwen3.8-flash-next-ud
VELO_LOCAL_BASE_URL=http://127.0.0.1:8091/v1

# ---- velo-llama-server only -------------------------------------------------
# The binary LM Studio ships (llama.cpp >= 2.46.0; 2.28.2 cannot load qwen4exp).
VELO_LLAMA_SERVER_DIR="$HOME/.cache/lm-studio/extensions/backends/llama.cpp-mac-arm64-apple-metal-advsimd-2.46.0"
VELO_LOCAL_GGUF="$HOME/.cache/lm-studio/models/unsloth/Qwen3.8-Flash-Next-UD-Q3_K_XL-GGUF/Qwen3.8-Flash-Next-UD-Q3_K_XL-00001-of-00003.gguf"
# Each flag measured on the benchmark above:
#   -fa on -c 262144        flash attention; the full native context (run D died at 131072)
#   -ub 2048 -b 4096        prefill 91 s -> 78 s
#   -ctk/-ctv q8_0          decode 21.4 -> 24.6 tok/s, and half the KV memory
#   --spec-type ngram-mod   decode 24.6 -> 27.1 tok/s; exact, agents repeat text
#   --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0   Qwen's thinking-mode sampling
#   -np 1                   one worker at a time; the GPU is the bottleneck
# MTP speculation needs unsloth's llama.cpp fork (PR ggml-org/llama.cpp#28243);
# this build rejects both MTP heads.
VELO_LLAMA_ARGS="-ngl 99 -c 262144 -np 1 -fa on -ub 2048 -b 4096 -ctk q8_0 -ctv q8_0 --spec-type ngram-mod --jinja --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0"
