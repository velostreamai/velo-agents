# The ONE place the worker:local model, its server and its sampling are defined.
#
# Sourced by velo-dispatch (the worker:local route), velo-pr-gate (check-spec
# and the second-opinion review), velo-status (route detection), velo-local-setup
# and velo-llama-server; read by both Python runners through
# velo_runner_lib.local_conf. The model id and endpoint used to be hardcoded in
# each of them, and the copies drifted.
#
# Qwen3.8-Flash-Next, unsloth UD-Q3_K_XL GGUF. Chosen on the #2235 A/B: the only
# local model with correct verdicts and exact root causes.
#
# Environment overrides for one run: VELO_LOCAL_MODEL (#2230), VELO_LMSTUDIO_URL.
VELO_LOCAL_MODEL_DEFAULT=qwen3.8-flash-next-ud

# ---- the server: LM Studio, tuned -------------------------------------------
# Same model, 43K-token prompt, M4 Max:
#   LM Studio, default load settings         214 s prefill   10.9 tok/s
#   LM Studio, the LMSTUDIO_* settings below 137 s            22.5 tok/s
#   llama-server (velo-llama-server)          87 s            26.0 tok/s
# A follow-up that reuses the prompt reads in 7.5 s on LM Studio, so an agent
# turn — mostly the same conversation re-sent — pays the decode gap, ~12%. Most
# of that is --spec-type ngram-mod, which LM Studio does not offer. Chosen for
# the UI: browsing, downloading and trying new models happen in one tool.
VELO_LOCAL_BASE_URL=http://127.0.0.1:1234/v1
# Written into LM Studio's per-model load config by velo-local-setup. Without
# them LM Studio loads 4 slots with small batches and is 2.5x slower.
LMSTUDIO_CONTEXT=262144          # native context; run D died at 131072
LMSTUDIO_EVAL_BATCH=4096         # prefill
LMSTUDIO_PHYSICAL_BATCH=2048     # prefill
LMSTUDIO_KV_TYPE=q8_0            # decode, and half the KV memory
LMSTUDIO_PARALLEL=1              # one worker at a time; the GPU is the bottleneck

# ---- sampling: SENT on every request by the runner ----------------------------
# Qwen's thinking-mode values. Sent rather than configured, because LM Studio's
# per-model sampling config could not be shown to apply and llama.cpp's own
# default is temp 0.8.
VELO_LOCAL_TEMPERATURE=1.0
VELO_LOCAL_TOP_P=0.95
VELO_LOCAL_TOP_K=20
VELO_LOCAL_MIN_P=0

# ---- the model files ---------------------------------------------------------
# In LM Studio's models folder, so its UI lists the model. Setup downloads any
# missing or short shard from VELO_LOCAL_HF.
VELO_LOCAL_HF=unsloth/Qwen3.8-Flash-Next-GGUF/UD-Q3_K_XL
VELO_LOCAL_GGUF_DIR="$HOME/.cache/lm-studio/models/unsloth/Qwen3.8-Flash-Next-UD-Q3_K_XL-GGUF"
VELO_LOCAL_GGUF_SHARDS="Qwen3.8-Flash-Next-UD-Q3_K_XL-00001-of-00003.gguf Qwen3.8-Flash-Next-UD-Q3_K_XL-00002-of-00003.gguf Qwen3.8-Flash-Next-UD-Q3_K_XL-00003-of-00003.gguf"

# ---- the faster alternative: velo-llama-server ----------------------------------
# ~12% faster decode, no UI. To use it: `velo-llama-server setup`, then set
# VELO_LOCAL_BASE_URL to VELO_LLAMA_SERVER_URL above. Do not run both with the
# model loaded: two 84 GB copies do not fit in 128 GB.
VELO_LLAMA_SERVER_URL=http://127.0.0.1:8091/v1
# Homebrew's llama.cpp: upstream build, fixed path, real --version. LM Studio's
# bundled copy measured the same (84.5 s / 27.1 tok/s) but lives in a versioned
# folder that moves on every runtime update. Needs a build that knows qwen4exp
# (11146 does).
VELO_LLAMA_SERVER=/opt/homebrew/bin/llama-server
#   -ub 2048 -b 4096        prefill 91 s -> 78 s
#   -ctk/-ctv q8_0          decode 21.4 -> 24.6 tok/s
#   --spec-type ngram-mod   decode 24.6 -> 27.1 tok/s; exact, agents repeat text
# MTP speculation needs unsloth's llama.cpp fork (ggml-org/llama.cpp#28243);
# stock builds reject both MTP heads.
VELO_LLAMA_ARGS="-ngl 99 -c $LMSTUDIO_CONTEXT -np 1 -fa on -ub $LMSTUDIO_PHYSICAL_BATCH -b $LMSTUDIO_EVAL_BATCH -ctk $LMSTUDIO_KV_TYPE -ctv $LMSTUDIO_KV_TYPE --spec-type ngram-mod --jinja --temp $VELO_LOCAL_TEMPERATURE --top-p $VELO_LOCAL_TOP_P --top-k $VELO_LOCAL_TOP_K --min-p $VELO_LOCAL_MIN_P"
